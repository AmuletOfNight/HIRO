# HIRO compatibility drop-in for polkit >= 127.
#
# polkit 127+ runs PAM authentication inside a sandboxed helper service.
# HIRO's PAM module only needs the daemon socket and V4L2 device nodes, so
# this drop-in relaxes the private-device sandbox just enough.
#
# Installed by the package as
#   /etc/systemd/system/polkit-agent-helper@.service.d/hiro.conf
# Remove it (and this file) if you do not use face auth from graphical
# polkit prompts.
[Service]
PrivateDevices=no
