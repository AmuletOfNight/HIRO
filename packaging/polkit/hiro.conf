# HIRO compatibility drop-in for polkit >= 127.
#
# polkit 127+ runs PAM authentication inside a sandboxed helper service.
# HIRO's PAM module is a thin client over the daemon's Unix socket — it
# never opens device nodes (hirod owns the camera), so the sandbox does not
# need to be relaxed. The previous version of this file set
# `PrivateDevices=no`, which removed host /dev isolation for *every* polkit
# authentication on the machine; that global weakening has been removed.
#
# If a future HIRO build ever needs camera nodes inside the polkit helper,
# add the narrow allow-list below instead of disabling PrivateDevices
# entirely:
#
#   DeviceAllow=char-video4linux rw
#
# Installed by the package as
#   /etc/systemd/system/polkit-agent-helper@.service.d/hiro.conf
# Remove this file (and the directory) if you do not use face auth from
# graphical polkit prompts.
[Service]
