[package]
name = "hiro-face"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Face detection and recognition pipeline for HIRO (ONNX Runtime; deterministic stub for tests)"

[features]
default = []
onnx = ["dep:ort"]

[dependencies]
hiro-core.workspace = true
thiserror.workspace = true
log.workspace = true
sha2.workspace = true
serde.workspace = true
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = { version = "2.0.0-rc.13", optional = true }

[dev-dependencies]
hiro-hw.workspace = true
tempfile = "3"
